<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8" />
  <title>bein-sports-1</title>
  <link href="https://1.huyashu.cfd/wp-content/plugins/AlbaPlayer-1//assets/css/style.css?v=11.1" rel="stylesheet">
  <script type="text/javascript" src="https://1.huyashu.cfd/wp-content/plugins/AlbaPlayer-1//assets/js/albaplayer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script> <!-- اضفنا مشغل HLS -->
</head>
<body>
  <div class="aplr-player-wrapper nbtn-st-1 nbtn-wd-1 nbtn-sz-m nbtn-pos-t rtl">
    <div class="aplr-player-content">
      <script type="text/javascript">
        var mobile = (/iphone|ipad|ipod|android|blackberry|mini|windows\sce|palm/i.test(navigator.userAgent.toLowerCase()));  
        if (mobile) {
          document.write('<video id="video" width="100%" height="100%" controls autoplay></video>');
          window.onload = function () {
            var video = document.getElementById('video');
            var videoSrc = 'https://top1-cdnnew.newkso.ru/top1-cdn/W0svhc8oj7/mono.m3u8';

            if (Hls.isSupported()) {
              var hls = new Hls();
              hls.loadSource(videoSrc);
              hls.attachMedia(video);
              hls.on(Hls.Events.ERROR, function (event, data) {
                console.error("حدث خطأ في البث:", data);
              });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
              video.src = videoSrc;
            } else {
              alert("متصفحك لا يدعم البث المباشر.");
            }
          };
        } else {
          document.write(`<iframe allowfullscreen='true' frameborder='0' height='100%' scrolling='1' src='https://pkpakiplay.xyz/embed.php?id=W0svhc8oj7' width='100%'></iframe>`);
        }
      </script>
    </div>
  </div>
</body>
</html>
